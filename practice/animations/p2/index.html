<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complex Slide Text Animation</title>

    <!-- <script src="app.js" defer></script> -->

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: 40px;

            background: #050505;
            color: white;

            font-family: Arial, sans-serif;

            perspective: 1000px;
        }

        input {
            width: 350px;
            padding: 15px 20px;

            border: 1px solid #444;
            border-radius: 12px;

            background: #111;
            color: white;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        input:focus {
            border-color: white;

            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.15);
        }

        #preview {
            min-height: 80px;

            display: flex;
            align-items: center;

            font-size: clamp(20px, 7vw, 30px);
            font-weight: 700;

            letter-spacing: 2px;

            white-space: pre-wrap;

            transform-style: preserve-3d;
        }

        .char {
            display: inline-block;

            min-width: 0.08em;

            transform-style: preserve-3d;

            will-change:
                transform,
                opacity,
                filter;

            transition:
                transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.35s ease,
                filter 0.35s ease;
        }

        /* New character starts here */
        .char.enter {
            opacity: 0;

            transform:
                translate3d(60px, 0, 80px) rotateY(-70deg) rotateX(20deg) scale(0.75);

            filter: blur(12px);
        }

        /* Final position */
        .char.active {
            opacity: 1;

            transform:
                translate3d(0, 0, 0) rotateY(0deg) rotateX(0deg) scale(1);

            filter: blur(0);
        }

        /* Character removal */
        .char.exit {
            opacity: 0;

            transform:
                translate3d(-50px, -20px, -50px) rotateY(70deg) rotateX(-20deg) scale(0.7);

            filter: blur(10px);

            transition:
                transform 0.3s ease,
                opacity 0.25s ease,
                filter 0.25s ease;
        }

        .space {
            width: 0.35em;
        }

        @media (max-width: 600px) {

            input {
                width: 85%;
            }

            #preview {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <input type="text" id="input" placeholder="Start typing..." autocomplete="off">

    <div id="preview"></div>

    <script>
        const input = document.getElementById("input");
            const preview = document.getElementById("preview");

            let previousText = "";


            /*
                Creates one animated character.
            */
            function createCharacter(char, index) {

                const span = document.createElement("span");

                span.classList.add("char");
                span.classList.add("enter");

                /*
                    Preserve spaces.
                */
                if (char === " ") {
                    span.classList.add("space");
                    span.innerHTML = "&nbsp;";
                } else {
                    span.textContent = char;
                }

                /*
                    Each character gets a slightly different delay.
                */
                const delay = Math.min(index * 35, 300);

                span.style.transitionDelay = `${delay}ms`;
                span.style.setProperty("--delay", `${delay}ms`);

                return span;
            }


            /*
                Updates the preview.
            */
            function updateText(newText) {

                /*
                    Find common part between
                    previous text and new text.
                */
                let commonLength = 0;

                while (
                    commonLength < previousText.length &&
                    commonLength < newText.length &&
                    previousText[commonLength] === newText[commonLength]
                ) {
                    commonLength++;
                }


                /*
                    -------------------------
                    HANDLE REMOVED CHARACTERS
                    -------------------------
                */

                const currentCharacters = [...preview.children];

                for (
                    let i = currentCharacters.length - 1;
                    i >= commonLength;
                    i--
                ) {

                    const element = currentCharacters[i];

                    element.classList.remove("active");
                    element.classList.add("exit");

                    setTimeout(() => {

                        if (element.parentNode) {
                            element.remove();
                        }

                    }, 350);
                }


                /*
                    -------------------------
                    HANDLE NEW CHARACTERS
                    -------------------------
                */

                for (
                    let i = commonLength;
                    i < newText.length;
                    i++
                ) {

                    const char = newText[i];

                    const element = createCharacter(char, i);

                    preview.appendChild(element);


                    /*
                        Force browser to recognize
                        the starting animation state.
                    */
                    requestAnimationFrame(() => {

                        requestAnimationFrame(() => {

                            element.classList.remove("enter");
                            element.classList.add("active");

                        });

                    });
                }


                previousText = newText;
            }


            /*
                Listen to typing.
            */
            input.addEventListener("input", (event) => {

                updateText(event.target.value);

            });
    </script>
</body>

</html>
